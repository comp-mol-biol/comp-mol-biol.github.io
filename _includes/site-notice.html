{% include base_path %}

<div id="site-notice" class="site-notice" hidden>
  <p>
    This site uses cookies for site analytics and for embedded content (the Google Maps
    embed on the <a href="{{ base_path }}/contact/">Contact page</a>). See our
    <a href="{{ base_path }}/terms/">cookie &amp; privacy notice</a> for details.
  </p>
  <div class="site-notice__actions">
    <button type="button" class="btn btn--small" id="site-notice-accept">Accept</button>
    <button type="button" class="btn btn--small btn--inverse" id="site-notice-decline">Decline</button>
  </div>
</div>

<script>
  (function () {
    var KEY = 'site_notice_choice';
    var banner = document.getElementById('site-notice');

    function activateGatedScripts() {
      var gated = document.querySelectorAll('script[type="text/plain"][data-consent-category]');
      for (var i = 0; i < gated.length; i++) {
        var old = gated[i];
        var s = document.createElement('script');
        for (var a = 0; a < old.attributes.length; a++) {
          var attr = old.attributes[a];
          if (attr.name !== 'type') { s.setAttribute(attr.name, attr.value); }
        }
        s.text = old.text;
        old.parentNode.replaceChild(s, old);
      }
    }

    function activateGatedIframes() {
      var frames = document.querySelectorAll('iframe[data-consent-src]');
      for (var i = 0; i < frames.length; i++) {
        frames[i].src = frames[i].getAttribute('data-consent-src');
        frames[i].removeAttribute('data-consent-src');
      }
    }

    function apply(choice) {
      if (choice === 'accepted') {
        activateGatedScripts();
        activateGatedIframes();
      }
    }

    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) {}

    if (stored) {
      apply(stored);
    } else if (banner) {
      banner.hidden = false;
    }

    if (banner) {
      document.getElementById('site-notice-accept').addEventListener('click', function () {
        try { localStorage.setItem(KEY, 'accepted'); } catch (e) {}
        apply('accepted');
        banner.hidden = true;
      });
      document.getElementById('site-notice-decline').addEventListener('click', function () {
        try { localStorage.setItem(KEY, 'declined'); } catch (e) {}
        banner.hidden = true;
      });
    }

    /* lets the Contact page's map placeholder (and the footer link) reopen the banner */
    window.reopenSiteNotice = function () {
      if (banner) { banner.hidden = false; }
    };
  })();
</script>
